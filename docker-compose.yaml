services:
  student-rest-api:
    image: ghcr.io/ramsharmas0109/sre-bootcamp:random
    restart: always
    ports:
      - "8080:8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:?required}
      DB_NAME: ${DB_NAME:?required}
      DB_USER: ${DB_USER:?required}
      DB_PASS: ${DB_PASS:?required}
      SSL_MODE: ${SSL_MODE:-disable}
      PORT: ${PORT:-8080}