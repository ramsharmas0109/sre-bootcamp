services:
  db:
    image: postgres:18.6
    restart: always
    ports:
      - "5555:5432"
    environment:
      POSTGRES_PASSWORD: ahl@123
    volumes:
      - student-db:/var/lib/postgresql
  student-rest-api:
    image: ramkaushik/student-rest-api:v1.0.0
    restart: always
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - db

volumes:
  student-db:

# Host machine -> Mac

# Container A -> Postgres expose port 5555, internally mapping that container'A port 5432 is accssible on host machine port 5555.

# Container B -> Ram:v1.6 this container is trying to connnect to localhost 5555. But there is no server running in side the container B at 5555. Instead we 
# need container B to connect to container A on port 5555.

# Container A is running in its own network, container B is running in its own network. My host has its own network.
# But we know that from host network on port 5555 we can access container A. So if we can run container B within host network then it should be able to access container A(db).

# Then to run this we just start the container with --network=host opts. 