# 1. clone the repo.
# 2. use dockerfile to build the image (assuming docker is installed)
# 3. docker scan
# 4. docker login - need token to push into GHCR
# 5. push the image to ghcr



name: Build Docker and Push

on:
  push:

jobs:
  build-and-push: #build docker image and push to container registry
    runs-on: ubuntu-latest
    steps: 
      - name: Git Checkout
        uses: actions/checkout@v7
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
      - name: Build Image
        run: |
          SHORT_SHA="${GITHUB_SHA:0:6}"
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          docker build -f Dockerfile.advanced -t student-rest-api:${SHORT_SHA} .
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: student-rest-api:${{ env.SHORT_SHA }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}        
      - name: Docker Tag
        run: docker tag student-rest-api:${SHORT_SHA} ghcr.io/ramsharmas0109/sre-bootcamp:${SHORT_SHA}
      - name: Docker Push
        run: docker push ghcr.io/ramsharmas0109/sre-bootcamp:${SHORT_SHA}