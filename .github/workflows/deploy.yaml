name : Deploy app

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        type: string
        default: "random"

env:
  COMPOSE_FILE: docker-compose.yaml

jobs:
  deployment:
    # runs-on: self-hosted
    environment: PROD
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          SSL_MODE: ${{ secrets.SSL_MODE }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: IMAGE_TAG,DB_HOST,DB_PASS,DB_PORT,DB_NAME,DB_USER,SSL_MODE,GH_TOKEN,GH_USERNAME
          script: |
            set -e

            echo "Setup Repo"
            if [ -d /home/sre-bootcamp/.git ]; then
              cd /home/sre-bootcamp
              git restore docker-compose.yaml
              git pull --ff-only
            else
              git clone https://github.com/ramsharmas0109/sre-bootcamp.git /home/sre-bootcamp
              cd /home/sre-bootcamp
            fi

            echo "Setup Migrate Tool"
            if which migrate >/dev/null 2>&1; then
              echo "golang-migrate is already installed."
            else
              curl -fsSL https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.tar.gz | tar xz
              sudo mv migrate /usr/local/bin/
            fi

            echo "Run DB Migrations"
            make migrate_up

            echo "Authenticate GHCR"
            echo "$GH_TOKEN" | docker login ghcr.io \
              -u "$GH_USERNAME" \
              --password-stdin

            echo "Pull Image"
            docker pull "ghcr.io/ramsharmas0109/sre-bootcamp:$IMAGE_TAG"

            echo "Update Image Tag"
            sed -i "s|image: ghcr.io/ramsharmas0109/sre-bootcamp:.*|image: ghcr.io/ramsharmas0109/sre-bootcamp:$IMAGE_TAG|" ${{ env.COMPOSE_FILE }}

            echo "Verify Compose File"
            grep "ghcr.io/ramsharmas0109/sre-bootcamp" ${{ env.COMPOSE_FILE }}

            echo "Start Application Container"
            docker compose -f ${{ env.COMPOSE_FILE }} up -d student-rest-api

            echo "Verify Application Health"
            curl --fail http://localhost:8080/healthcheck

            echo "Deployment successful!"
