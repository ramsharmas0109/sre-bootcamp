name: Go Build and Test

on:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          go-version-file: 'go.mod'         

      - name: Set up Docker
        uses: docker/setup-docker-action@v5

      - name: Test
        run: make test

      - name: Build
        run: make build